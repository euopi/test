<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The embedded player refuses to play without a referrer (error 153). -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Tube</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23e5484d'/%3E%3Cpath d='M9 7l8 5-8 5z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/"><span class="logo-mark"></span>Tube</a>
    <form id="search" class="search" role="search">
      <input id="q" type="search" placeholder="Search, or paste a YouTube link" autocomplete="off" aria-label="Search">
      <button type="submit" aria-label="Search">Search</button>
    </form>
    <nav class="nav">
      <a href="#/" data-nav="/">Home</a>
      <a href="#/trending" data-nav="/trending">Trending</a>
      <a href="#/library" data-nav="/library">Library</a>
      <a href="#/settings" data-nav="/settings">Settings</a>
      <span id="account" class="account"></span>
    </nav>
  </header>
  <main id="app"></main>
  <script src="app.js"></script>
</body>
</html>
